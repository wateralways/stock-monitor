name: Stock Monitor Daily
on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送代码
      pages: write      # 允许部署 GitHub Pages
      id-token: write   # 用于 Pages 部署验证
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run stock monitor
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      run: |
        python github_actions_runner.py
            
    - name: Commit and push if changed    
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update stock monitor report - $(date '+%Y-%m-%d %H:%M')"
        git pull --rebase origin main  # 新增：拉取远程最新代码，解决冲突
        git push
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
