name: Stock Monitor Daily

on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '46 6 * * 1-5'
    - cron: '5 7 * * 1-5'
    - cron: '35 8 * * 1-5'
    - cron: '40 1 * * 1-5'
    - cron: '20 2 * * 1-5'
    - cron: '00 4 * * 1-5'
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run stock monitor
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      run: |
        # 先跑 trades page, 生成 docs/win_rates.json 供 monitor 消费最新胜率
        python generate_trades_page.py || echo "[WARN] trades page generation failed"
        python stock_monitor_unified_realtime.py > monitor_output.txt 2>&1 || true
        echo "--- Monitor output (first 100 lines) ---"
        head -100 monitor_output.txt
        echo "--- End monitor output ---"
        python github_actions_runner.py --from-file monitor_output.txt

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
